# tribe-control uses endless method definitions and `in` pattern matching,
# both 3.0+. Without this, rubocop defaults to TargetRubyVersion 2.7, fails
# to parse the file, and reports 41 Lint/Syntax offences that are artefacts
# of the wrong parser: the run looks thorough and evaluates no real cop at
# all. The bench Pi runs 3.1.
AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  # A bundle vendored in the tree is not this project's code. Without
  # this, a `bundle install` here (the user-level bundler config on this
  # machine vendors into ./vendors) takes the offence count from about a
  # thousand to seven and a half, which reads as a catastrophe and is
  # somebody else's gems.
  Exclude:
    - 'vendor/**/*'
    - 'vendors/**/*'
