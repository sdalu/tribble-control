# -*- conf -*-
#
# Which device sits on which hub port, and how to reach it.  Copy this
# beside your own setup's configuration, edit it, and point
# tribe-control at it with -D/--devlist.
#
# See `tribe-control --man`: DEVLIST for every key, PROTECTED PORTS for
# what 'reserved' and 'undeclared' do.
#
# Two keys on one line need a comma between them; one key per line, as
# below, needs nothing.

# What happens to a port this file does not mention.  'protect' is the
# default and means only declared ports may be powered down; 'switch'
# means any of the 16 may be.
undeclared = protect

# Ports that must never be powered down, whichever mode is in force.
# Anything the hub feeds but nobody talks to belongs here: a
# single-board computer, a powered peripheral.  Nothing notices if
# their VBUS disappears, they simply reboot, uncleanly, mid-write.
reserved = [ 13, 14, 15, 16 ]

# Which tally reads the boards' consoles: it counts what the firmware
# prints and writes the SUMMARY line at the end of a 'connect' capture.
# 'lines' (the default) counts lines and nothing else; 'none' writes no
# summary; anything else is registered by a Ruby file given with
# -r/--require, and is where knowledge of one firmware's output lives.
# See `tribe-control --man`: TALLIES.  A device entry may override it.
tally = lines

# Settings a device can inherit, so that what a KIND of board is gets
# said once instead of on every board of that kind.  A device names one
# with `type =`, and its own keys win over the type's.
#
# A type may not set 'port' or 'serial' -- both name one particular
# board -- and types do not nest.  A type nothing defines here is an
# error, not a quiet fall back to the tool's defaults: a board that
# asked for jlink and silently got cmsis-dap is a flash through the
# wrong probe, reported as success.
types {
  nrf52840-mdk {
    interface = cmsis-dap
    target    = nrf52
    transport = swd
    baud      = 230400
  }
  dwm1001-dev {
    interface   = jlink
    target      = nrf52
    transport   = swd
    baud        = 115200
    # For a module whose radio does not come back from a plain SWD
    # reset: cut and restore the port after a successful flash.
    power_cycle = after-flash
  }
}

# Every other key is a device.  'port' is required: the hub's own port
# number, 1 to 16.
#
# 'serial' is the debug probe's serial number, not the board's.  It is
# what addresses a board for 'reset' and for flashing in parallel
# (--method serial), so a board without one can only be reached by
# cutting every other port (--method power).  Read it off a powered
# board with `tribe-control serial <name>` and paste it whole: 48 hex
# characters for CMSIS-DAP, 12 for J-Link.
alpha {
  type   = nrf52840-mdk
  serial = '1026360216055e5b00000000000000000000000097969902'
  port   = 1
}

# interface defaults to cmsis-dap, target to nrf52 and baud to 230400.
# Spelling them out on every board, as above, is worth the noise once a
# setup carries more than one kind: a default that fits most of them and
# not the rest is the sort of thing nobody checks until a flash goes to
# the wrong probe or a console comes back as noise.
#
# interface and target are independent: the first is the openocd
# interface script (which probe), the second its target script (which
# chip).  Either is any name openocd can find, without the .cfg.
#
# transport defaults to swd; set it to jtag, or to whatever the pair
# speaks, and to none to let the interface script decide.  work_area,
# not shown, is the target RAM openocd may use for flash algorithms:
# 0x4000 by default, or none to leave it to the target script.
beta {
  type   = dwm1001-dev
  serial = '000760040233'
  port   = 7
}

# A type says what a KIND has in common; an entry may still differ.
# This one is an MDK whose console has been moved.
delta {
  type   = nrf52840-mdk
  serial = '1026360213072dde00000000000000000000000097969902'
  baud   = 9600
  port   = 3
}

# A board with no serial is still switchable and still has a console;
# it just cannot be reset, or flashed in parallel.
gamma {
  port = 2
}

# 'port = none' keeps a record without a board: the entry is never
# selected, switched or flashed, and naming it says so.  Write it when
# a board stops enumerating and its port is given away, so that its
# serial is not lost.
retired {
  serial = '1026360202c4dc0f00000000000000000000000097969902'
  port   = none
}
